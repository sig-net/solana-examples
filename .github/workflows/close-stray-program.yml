# One-off cleanup for the stray program that the old `anchor deploy` step
# published on 2026-08-26 (EyT52taHZPmcb9VX6AFfXgx6mtLnqXDEkj4s8thUmMYG). That
# program carries declare_id!(DLJ41...), so it can never execute; closing it
# returns its rent to the deployer. Delete this file once it has run.
name: Close Stray Solana Program (devnet)

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Program account to close and refund
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solana-devnet-program
  cancel-in-progress: false

env:
  SOLANA_VERSION: 2.2.20
  SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
  SOLANA_DEPLOYER_PRIVATE_KEY: ${{ secrets.SOLANA_DEPLOYER_PRIVATE_KEY }}
  # Closing a program is irreversible and burns the address permanently. The
  # program the examples actually run against must never be a valid target.
  PROTECTED_PROGRAM_ID: DLJ41RXS8NE2nLPQWRMZHhjKDgSYgxJxECR1NtQEUkvR

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in SOLANA_RPC_URL SOLANA_DEPLOYER_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Refuse to close the protected program
        run: |
          set -euo pipefail
          if [ "${{ inputs.program_id }}" = "${PROTECTED_PROGRAM_ID}" ]; then
            echo "::error::Refusing to close ${PROTECTED_PROGRAM_ID}: closing it would permanently burn the address the examples depend on"
            exit 1
          fi

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> "${GITHUB_PATH}"

      - name: Configure deployer wallet
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/solana"
          printf '%s' "${SOLANA_DEPLOYER_PRIVATE_KEY}" > "${HOME}/.config/solana/deployer.json"
          chmod 600 "${HOME}/.config/solana/deployer.json"

      - name: Close and refund
        run: |
          set -euo pipefail
          deployer="$(solana address -k "${HOME}/.config/solana/deployer.json")"

          echo "before: $(solana balance "${deployer}" --url "${SOLANA_RPC_URL}")"
          solana program show "${{ inputs.program_id }}" \
            --url "${SOLANA_RPC_URL}" \
            --keypair "${HOME}/.config/solana/deployer.json"

          solana program close "${{ inputs.program_id }}" \
            --recipient "${deployer}" \
            --authority "${HOME}/.config/solana/deployer.json" \
            --keypair "${HOME}/.config/solana/deployer.json" \
            --url "${SOLANA_RPC_URL}" \
            --bypass-warning

          echo "after:  $(solana balance "${deployer}" --url "${SOLANA_RPC_URL}")"
