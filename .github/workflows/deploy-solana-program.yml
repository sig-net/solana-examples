name: Deploy Solana Program (devnet)

# The program is deployed when its source changes, not on a schedule.
on:
  push:
    branches:
      - main
    paths:
      - contract/programs/**
      - contract/Cargo.toml
      - contract/Cargo.lock
      - contract/Anchor.toml
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to build and deploy
        required: false
        default: main
        type: string

permissions:
  contents: read

# Serializes every job that writes to the on-chain program: concurrent runs
# would rewrite the same program account.
concurrency:
  group: solana-devnet-program
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANCHOR_VERSION: 0.31.1
      SOLANA_VERSION: 2.2.20
      TARGET_REF: ${{ inputs.target_ref || github.ref }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      SOLANA_DEPLOYER_PRIVATE_KEY: ${{ secrets.SOLANA_DEPLOYER_PRIVATE_KEY }}
    defaults:
      run:
        shell: bash
        working-directory: contract
    steps:
      - name: Check out target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          set -euo pipefail

          for name in SOLANA_RPC_URL SOLANA_DEPLOYER_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libudev-dev clang llvm jq

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> "${GITHUB_PATH}"

      - name: Install Anchor CLI
        run: |
          set -euo pipefail
          . "${HOME}/.cargo/env"
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          anchor --version

      - name: Configure deployer wallet
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/solana"
          printf '%s' "${SOLANA_DEPLOYER_PRIVATE_KEY}" > "${HOME}/.config/solana/deployer.json"
          chmod 600 "${HOME}/.config/solana/deployer.json"
          echo "deployer: $(solana address -k "${HOME}/.config/solana/deployer.json")"

      - name: Build Solana program
        run: anchor build

      - name: Check upgrade authority
        run: |
          set -euo pipefail

          program_id="$(jq -r .address target/idl/solana_core_contracts.json)"
          deployer="$(solana address -k "${HOME}/.config/solana/deployer.json")"
          # --keypair is required even though this only reads: the deployer key
          # lives at deployer.json, so there is no default signer for the CLI to
          # resolve and `solana program show` errors out before printing.
          authority="$(solana program show "${program_id}" \
            --url "${SOLANA_RPC_URL}" \
            --keypair "${HOME}/.config/solana/deployer.json" \
            | awk '/Authority/{print $2}')"

          echo "program:   ${program_id}"
          echo "authority: ${authority}"
          echo "deployer:  ${deployer}"

          if [ "${authority}" != "${deployer}" ]; then
            echo "::error::SOLANA_DEPLOYER_PRIVATE_KEY does not hold upgrade authority over ${program_id}"
            exit 1
          fi

          echo "PROGRAM_ID=${program_id}" >> "${GITHUB_ENV}"

      # `anchor deploy` takes the program address from
      # target/deploy/<name>-keypair.json, which target/ being gitignored means
      # a clean runner does not have: it generates a fresh keypair and publishes
      # a brand-new program instead of upgrading. Upgrading in place needs only
      # the upgrade authority, so pin the address that was just verified.
      - name: Deploy
        run: |
          solana program deploy target/deploy/solana_core_contracts.so \
            --program-id "${PROGRAM_ID}" \
            --upgrade-authority "${HOME}/.config/solana/deployer.json" \
            --keypair "${HOME}/.config/solana/deployer.json" \
            --url "${SOLANA_RPC_URL}"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Deploy Solana Program (devnet)"
            echo
            echo "- Ref: \`${TARGET_REF}\`"
            echo "- Program: \`${PROGRAM_ID:-unknown}\`"
            echo "- Anchor: \`${ANCHOR_VERSION}\`"
            echo "- Solana/Agave: \`${SOLANA_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
