name: ERC20 E2E Hourly

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to test
        required: false
        default: xiangyi/solana_e2e
        type: string
      mpc_network:
        description: MPC network to test against
        required: false
        default: testnet
        type: choice
        options:
          - dev
          - testnet
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# Shared with the deploy workflow: the suite must not run while the program is
# being replaced underneath it.
concurrency:
  group: solana-devnet-program
  cancel-in-progress: false

jobs:
  contract-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANCHOR_VERSION: 0.31.1
      SOLANA_VERSION: 2.2.20
      TARGET_REF: ${{ inputs.target_ref || 'xiangyi/solana_e2e' }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
      # The chain-signatures program and the MPC root key are both resolved
      # from signet.js for this network, so neither is configured here.
      MPC_NETWORK: ${{ inputs.mpc_network || 'testnet' }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
      DISABLE_LOCAL_CHAIN_SIGNATURE_SERVER: "true"
    defaults:
      run:
        shell: bash
        working-directory: contract
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          set -euo pipefail

          required=(
            SOLANA_RPC_URL
            SOLANA_PRIVATE_KEY
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

          if [ -z "${SEPOLIA_RPC_URL:-}" ] && [ -z "${INFURA_API_KEY:-}" ]; then
            echo "::error::Set either SEPOLIA_RPC_URL or INFURA_API_KEY"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: contract/yarn.lock

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libudev-dev \
            clang \
            llvm \
            jq

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          . "${HOME}/.cargo/env"
          rustc --version
          cargo --version

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "${HOME}/.local/share/solana/install/active_release/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/share/solana/install/active_release/bin:${PATH}"
          solana --version

      - name: Install Anchor CLI
        run: |
          set -euo pipefail
          . "${HOME}/.cargo/env"
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          anchor --version

      - name: Enable Corepack and confirm Yarn
        run: |
          set -euo pipefail
          corepack enable
          node --version
          yarn --version

      - name: Configure Solana wallet
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/solana"

          # The test wallet. Anchor.toml's provider.wallet points at this file,
          # so it is what the suite signs and pays with. This job deliberately
          # holds no key with upgrade authority over the program.
          printf '%s' "${SOLANA_PRIVATE_KEY}" > "${HOME}/.config/solana/id.json"
          chmod 600 "${HOME}/.config/solana/id.json"

          solana config set --keypair "${HOME}/.config/solana/id.json"
          solana config set --url devnet

          echo "test wallet: $(solana address -k "${HOME}/.config/solana/id.json") ($(solana balance -k "${HOME}/.config/solana/id.json" || echo unknown))"

      - name: Write contract environment file
        run: |
          set -euo pipefail
          {
            printf 'MPC_NETWORK=%s\n' "${MPC_NETWORK}"

            if [ -n "${SEPOLIA_RPC_URL:-}" ]; then
              printf 'SEPOLIA_RPC_URL=%s\n' "${SEPOLIA_RPC_URL}"
            fi

            if [ -n "${INFURA_API_KEY:-}" ]; then
              printf 'INFURA_API_KEY=%s\n' "${INFURA_API_KEY}"
            fi
            printf 'DISABLE_LOCAL_CHAIN_SIGNATURE_SERVER=%s\n' "${DISABLE_LOCAL_CHAIN_SIGNATURE_SERVER}"
          } > .env

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build Solana program
        run: anchor build

      - name: Compare deployed program against this ref
        run: |
          set -euo pipefail

          program_id="$(jq -r .address target/idl/solana_core_contracts.json)"
          echo "program: ${program_id}"

          solana program dump "${program_id}" /tmp/deployed.so \
            --url "${SOLANA_RPC_URL}" > /dev/null

          # `solana program dump` pads to the allocated length; compare only the
          # meaningful bytes.
          truncate -s "$(stat -c %s target/deploy/solana_core_contracts.so)" /tmp/deployed.so

          if cmp -s /tmp/deployed.so target/deploy/solana_core_contracts.so; then
            echo "DEPLOY_STATE=matches this ref" >> "${GITHUB_ENV}"
          else
            echo "DEPLOY_STATE=differs from this ref" >> "${GITHUB_ENV}"
            echo "::warning::The deployed program does not match a build of this ref. This job tests the deployed bytecode; run the 'Deploy Solana Program (devnet)' workflow to update it."
          fi

      - name: Check formatting
        run: yarn lint

      - name: Run ERC20 end-to-end test
        run: |
          anchor run test-erc20 --provider.cluster "${SOLANA_RPC_URL}"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## ERC20 E2E Hourly"
            echo
            echo "- Ref: \`${TARGET_REF}\`"
            echo "- Anchor: \`${ANCHOR_VERSION}\`"
            echo "- Solana/Agave: \`${SOLANA_VERSION}\`"
            echo "- MPC network: \`${MPC_NETWORK}\`"
            echo "- Deployed program: \`${DEPLOY_STATE:-unknown}\`"
            echo "- Test wallet: \`$(solana address -k "${HOME}/.config/solana/id.json" 2>/dev/null || echo unknown)\`"
            echo "- Local chain-signature server disabled: \`${DISABLE_LOCAL_CHAIN_SIGNATURE_SERVER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
