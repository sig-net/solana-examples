[toolchain]
package_manager = "yarn"
solana_version = "2.2.20"

[features]
resolution = true
skip-lint = false

[programs.devnet]
solana_core_contracts = "DLJ41RXS8NE2nLPQWRMZHhjKDgSYgxJxECR1NtQEUkvR"

[programs.localnet]
solana_core_contracts = "GjU1P2X665JX3kygXqYYttTncfUwwh1akDK2apV13GUf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Runs every suite, including BTC, around a Bitcoin regtest container.
test = "yarn btc:start && NODE_OPTIONS='--import tsx' yarn run mocha --no-warnings --timeout 1000000 --exit 'tests/**/*.ts'; exitcode=$?; yarn btc:stop; exit $exitcode"

# The ERC20 suite on its own: no Bitcoin container, no BTC suites.
test-erc20 = "NODE_OPTIONS='--import tsx' yarn run mocha --no-warnings --timeout 2500000 --exit 'tests/sign-respond-erc20.ts'"
